apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubepath-managed-kubernetes-exporter
  labels:
    app.kubernetes.io/name: cubepath-managed-kubernetes-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cubepath-managed-kubernetes-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cubepath-managed-kubernetes-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/cubepathinc/cubepath-managed-kubernetes-exporter:latest
          args:
            - --api-token-file=/etc/cubepath/token
          ports:
            - name: metrics
              containerPort: 9777
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: token
              mountPath: /etc/cubepath
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: cubepath-managed-kubernetes-exporter
            items:
              - key: token
                path: token
