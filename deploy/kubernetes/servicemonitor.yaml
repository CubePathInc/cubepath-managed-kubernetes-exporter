# Optional. Needs the Prometheus Operator CRDs. Apply it on its own:
#   kubectl apply -f servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cubepath-k8s-exporter
  labels:
    app.kubernetes.io/name: cubepath-k8s-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cubepath-k8s-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
