# Minimal Prometheus configuration that scrapes cubepath-k8s-exporter and loads its rules.
#
# The exporter refreshes its data every 60 seconds, so a scrape interval below 60s adds
# nothing. Use 60s (or 30s at the lowest).

global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/cubepath-kubernetes.rules.yaml

scrape_configs:
  - job_name: cubepath-k8s-exporter
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["cubepath-k8s-exporter:9777"]
